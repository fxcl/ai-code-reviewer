# Self-hosted / private setup: review with a local Ollama model.
# Your code and diffs never leave your own infrastructure.
name: AI Code Review (Ollama)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Ollama runs on a machine you control, so this job must run on a
    # self-hosted runner that can reach the Ollama daemon at base_url.
    runs-on: self-hosted
    steps:
      - name: AI Code Review
        uses: fxcl/ai-code-reviewer@v1
        with:
          provider: ollama
          # Any model you have pulled, e.g. `ollama pull qwen2.5-coder`.
          model: qwen2.5-coder
          base_url: http://localhost:11434
          # No api_key is required — Ollama serves models without authentication.
