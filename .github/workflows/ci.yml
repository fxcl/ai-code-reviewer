name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Corepack auto-downloads pnpm per the packageManager field; suppress the
  # interactive prompt that would hang CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 22 for the dev toolchain (pnpm 11 requires it); the action itself
      # still runs on the node24 runtime — dist is bundled with target=node24.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # pnpm/action-setup's self-installer hangs; corepack (bundled with Node)
      # installs pnpm 11.10.0 from the npm registry instead.
      - name: Enable corepack (installs pnpm per packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: Test with coverage thresholds
        run: pnpm test

      - name: Build action bundle
        run: pnpm build:action

      - name: Verify committed dist is fresh
        # Catches both modified tracked files and never-committed new files
        # (e.g. dist/package.json), which `git diff --exit-code` alone misses.
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            echo "dist/ is stale or has uncommitted files; run 'pnpm build:action' and commit the result." >&2
            exit 1
          fi
