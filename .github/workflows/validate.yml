name: AI Code Reviewer Validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # StepFun provider config
  LLM_PROVIDER: openai-compatible
  LLM_BASE_URL: https://api.stepfun.ai/step_plan/v1
  LLM_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
  LLM_MODEL: step-3.7-flash

  # Fallback provider configs (kept for smoke tests)
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  validate:
    name: Validate Action Functionality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: TypeScript typecheck - pi-agent
        run: npx tsc --noEmit -p packages/pi-agent/tsconfig.json

      - name: TypeScript typecheck - action
        run: npx tsc --noEmit -p packages/action/tsconfig.json

      - name: TypeScript typecheck - pi-session
        run: npx tsc --noEmit -p packages/pi-session/tsconfig.json

      - name: TypeScript typecheck - pi-tools
        run: npx tsc --noEmit -p packages/pi-tools/tsconfig.json

      - name: Run pi-agent tests
        run: npx vitest run -p packages/pi-agent/vitest.config.ts

      - name: Run action tests
        run: npx vitest run -p packages/action/vitest.config.ts

      - name: Run pi-session tests
        run: npx vitest run -p packages/pi-session/vitest.config.ts

      - name: Run pi-tools tests
        run: npx vitest run -p packages/pi-tools/vitest.config.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            packages/*/coverage/
            packages/*/test-results/
          retention-days: 7

  action-smoke-test:
    name: Action Smoke Test with StepFun
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify StepFun provider can be created
        run: |
          node -e "
            const { createLLMProvider } = require('./packages/pi-agent/src/index.ts');
            const provider = createLLMProvider({
              provider: 'openai-compatible',
              model: process.env.LLM_MODEL,
              baseUrl: process.env.LLM_BASE_URL,
              apiKey: process.env.LLM_API_KEY,
            });
            console.log('Provider created:', provider.name);
          "
        env:
          LLM_MODEL: ${{ env.LLM_MODEL }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.STEPFUN_API_KEY }}

      - name: Validate action imports
        run: |
          node -e "
            const { run } = require('./packages/action/src/run.ts');
            const { parseUnifiedDiff, renderSummaryMarkdown, review } = require('./packages/pi-agent/src/review/index.ts');
            console.log('Action imports validated successfully');
          "
