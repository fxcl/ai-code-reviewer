name: AI Code Review

on:
  pull_request:

# One review per PR: a new push cancels the in-flight review instead of
# racing it (concurrent runs would each post their own summary comment).
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: AI Code Review
        uses: fxcl/ai-code-reviewer@main
        with:
          provider: openai-compatible
          base_url: https://api.stepfun.ai/step_plan
          model: step-3.7-flash
          api_key: ${{ secrets.STEPFUN_API_KEY }}
          language: zh-CN
          severity_threshold: low
